<!doctype html>
<html lang="ru">

<title>Дом 3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfd8ee; font-family: Segoe UI, Arial, sans-serif; }
  .panel { position: fixed; background: rgba(255,255,255,.93); border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.18); z-index: 10; font-size: 14px; }
  #ui { top: 12px; left: 12px; padding: 10px 12px; line-height: 1.5; width: 250px; }
  #ui h1 { font-size: 16px; margin: 0 0 6px; }
  #ui h2 { font-size: 12px; margin: 8px 0 3px; color: #666; font-weight: normal; text-transform: uppercase; letter-spacing: .5px; }
  #ui label { display: block; cursor: pointer; }
  #ui .row button { padding: 5px 3px; font-size: 12.5px; }
  .row { display: flex; gap: 5px; margin: 3px 0; flex-wrap: wrap; }
  button { flex: 1; padding: 5px 6px; border: 1px solid #9aa; border-radius: 5px; background: #f4f6f7; cursor: pointer; font: inherit; font-size: 13px; white-space: nowrap; }
  button.on { background: #2f6f9f; color: #fff; border-color: #2f6f9f; }
  #rooms { top: 12px; right: 12px; width: 210px; max-height: calc(100vh - 24px); overflow-y: auto; padding: 8px 10px; }
  #rooms h3 { font-size: 13px; margin: 8px 0 4px; color: #666; }
  #rooms div.r { padding: 3px 6px; border-radius: 4px; cursor: pointer; font-size: 13px; }
  #rooms div.r:hover { background: #e5eef5; }
  #rooms div.r.here { background: #2f6f9f; color: #fff; }
  #edit { left: 274px; top: 12px; width: 290px; padding: 10px 12px; display: none; line-height: 1.45; }
  #edit #eSel { margin: 6px 0; padding: 6px 8px; background: #f1f4f6; border-radius: 5px; font-size: 13px; min-height: 36px; }
  #edit .ehint { color: #555; font-size: 12px; margin-top: 6px; }
  #edit button:disabled { opacity: .45; cursor: default; }
  #map { left: 12px; bottom: 12px; padding: 6px; display: none; }
  #map canvas { display: block; cursor: crosshair; }
  #where { top: 12px; left: 50%; transform: translateX(-50%); padding: 6px 14px; font-weight: bold; display: none; }
  #hint { bottom: 12px; left: 50%; transform: translateX(-50%); padding: 6px 12px; font-size: 13px; color: #333; max-width: 60vw; text-align: center; }
  #cross { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(255,255,255,.8); box-shadow: 0 0 2px #000; z-index: 9; display: none; pointer-events: none; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 15; }
  #msg { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #fff; font-size: 16px; padding: 24px; text-align: center; z-index: 20; }
  #fps { position: fixed; right: 230px; bottom: 8px; font-size: 12px; color: #fff; text-shadow: 0 0 3px #000; z-index: 10; }
  .label { background: rgba(255,255,255,.85); padding: 2px 6px; border-radius: 4px; font-size: 12px; color: #222; white-space: nowrap; pointer-events: none; text-align: center; }
  .label b { display: block; font-size: 11px; color: #666; font-weight: normal; }
  .compass { background: #c0392b; color: #fff; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 13px; }
</style>

<div id="ui" class="panel">
  <h1>Дом 3D</h1>
  <h2>Режим</h2>

  <h2>Качество картинки</h2>
  <div class="row"><button id="bQHigh" class="on">✨ Высокое</button><button id="bQLow">⚡ Обычное</button></div>

    <label><input type="checkbox" id="tRoof" checked> Крыша</label>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const D = window.HOUSE;
if (!D) { showMsg('Не найден файл dom-data.js — он должен лежать рядом с dom-3d.html.'); throw new Error('no data'); }
const AT = D.levels.attic.z, GF_H = D.levels.gf.h, TERR = D.meta.terrain;
const CENTER = new THREE.Vector3(14.5, 0, 15);

// =====================================================================
//  Рендер, камера, сцена
// =====================================================================
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.AgXToneMapping;   // плёночная цветопередача, мягкие светлые участки
document.body.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', top: '0', left: '0', pointerEvents: 'none' });
document.body.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 800);
camera.position.set(48, 32, 62);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(14.5, 2, 15);
controls.maxPolarAngle = Math.PI * 0.495;
controls.update();

// =====================================================================
//  Текстуры — рисуются в коде, без внешних файлов. Масштаб: 1 единица UV = 1 метр.
// =====================================================================
let seed = 12345;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function tex(px, meters, draw) {
  const c = document.createElement('canvas'); c.width = c.height = px;
  const g = c.getContext('2d'); draw(g, px);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1 / meters, 1 / meters);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
function speckle(g, px, base, amp, n, size = 2) {
  g.fillStyle = base; g.fillRect(0, 0, px, px);
  for (let i = 0; i < n; i++) {
    const v = (rnd() - 0.5) * amp;
    g.fillStyle = v > 0 ? `rgba(255,255,255,${v})` : `rgba(0,0,0,${-v})`;
    g.fillRect(rnd() * px, rnd() * px, size, size);
  }
}
const TEX = {
  plaster: tex(256, 2, (g, p) => speckle(g, p, '#efede8', 0.08, 6000)),
  parquet: tex(512, 1.2, (g, p) => {           // дубовая доска 15 × 120 см вразбежку
    const rows = 8, rh = p / rows;
    for (let r = 0; r < rows; r++) {
      const off = rnd() * p;
      for (let k = -1; k < 2; k++) {
        const l = 140 + rnd() * 30, x0 = off + k * p;
        g.fillStyle = `hsl(${30 + rnd() * 6}, ${38 + rnd() * 10}%, ${58 + rnd() * 10}%)`;
        g.fillRect(x0, r * rh, p, rh);
        for (let i = 0; i < 14; i++) { g.strokeStyle = `rgba(90,60,30,${0.05 + rnd() * 0.08})`; g.beginPath(); const yy = r * rh + rnd() * rh; g.moveTo(x0, yy); g.lineTo(x0 + p, yy + (rnd() - 0.5) * 6); g.stroke(); }
        g.fillStyle = 'rgba(60,40,20,.35)'; g.fillRect(x0, r * rh, 2, rh);
      }
      g.fillStyle = 'rgba(60,40,20,.3)'; g.fillRect(0, r * rh, p, 1.5);
    }
  }),
  tile: tex(256, 1.2, (g, p) => {               // плитка 60 × 60 см
    speckle(g, p, '#dcd9d3', 0.05, 3000);
    g.fillStyle = '#b8b4ac'; for (const v of [0, p / 2]) { g.fillRect(v, 0, 2, p); g.fillRect(0, v, p, 2); }
  }),
  terrace: tex(256, 1.2, (g, p) => {            // уличная плитка 60 × 120 см
    speckle(g, p, '#9c9a95', 0.08, 5000);
    g.fillStyle = '#7d7b77'; g.fillRect(0, 0, p, 2); g.fillRect(0, p / 2, p, 2); g.fillRect(0, 0, 2, p / 2); g.fillRect(p / 2, p / 2, 2, p / 2);
  }),
  paving: tex(256, 2, (g, p) => {               // тёмные плиты 1 × 1 м
    speckle(g, p, '#5e6266', 0.08, 5000);
    g.fillStyle = '#45484c'; for (const v of [0, p / 2]) { g.fillRect(v, 0, 2, p); g.fillRect(0, v, p, 2); }
  }),
  concrete: tex(256, 3, (g, p) => speckle(g, p, '#a7a7a4', 0.1, 9000, 3)),
  gravel: tex(256, 1, (g, p) => { speckle(g, p, '#b9b4aa', 0.35, 12000, 3); }),
  grass: tex(256, 4, (g, p) => { speckle(g, p, '#6c9a4c', 0.18, 14000, 3); }),
  seam: tex(256, 1, (g, p) => {                 // металлический фальц, шаг 50 см (серо-графитовый, как на картинках)
    g.fillStyle = '#7e848b'; g.fillRect(0, 0, p, p);
    for (const x of [0, p / 2]) { g.fillStyle = '#868c93'; g.fillRect(x, 0, 4, p); g.fillStyle = '#4f545a'; g.fillRect(x + 4, 0, 3, p); }
  }),
  larch: tex(256, 1, (g, p) => {                // доска лиственницы 14 см, горизонтально
    const n = 7, h = p / n;
    for (let i = 0; i < n; i++) {
      g.fillStyle = `hsl(${27 + rnd() * 6}, ${45 + rnd() * 10}%, ${45 + rnd() * 10}%)`; g.fillRect(0, i * h, p, h);
      for (let k = 0; k < 6; k++) { g.strokeStyle = 'rgba(70,40,15,.12)'; g.beginPath(); const yy = i * h + rnd() * h; g.moveTo(0, yy); g.lineTo(p, yy + (rnd() - 0.5) * 4); g.stroke(); }
      g.fillStyle = 'rgba(40,25,10,.45)'; g.fillRect(0, i * h, p, 2);
    }
  }),
  oak: tex(256, 0.8, (g, p) => {                // дуб для мебели: продольные волокна
    g.fillStyle = '#b88a58'; g.fillRect(0, 0, p, p);
    for (let i = 0; i < 90; i++) { g.strokeStyle = `rgba(${rnd() > 0.5 ? '90,55,25' : '220,180,130'},${0.06 + rnd() * 0.1})`; g.lineWidth = 1 + rnd() * 2; g.beginPath(); const y = rnd() * p; g.moveTo(0, y); g.bezierCurveTo(p / 3, y + (rnd() - 0.5) * 10, p * 2 / 3, y + (rnd() - 0.5) * 10, p, y + (rnd() - 0.5) * 6); g.stroke(); }
  }),
  fabric: tex(128, 0.25, (g, p) => {            // рогожка для обивки
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, p, p);
    for (let i = 0; i < p; i += 2) { g.fillStyle = `rgba(0,0,0,${0.04 + rnd() * 0.05})`; g.fillRect(i, 0, 1, p); g.fillRect(0, i, p, 1); }
  }),
  panel: tex(256, 2.4, (g, p) => {              // крупные фасадные панели 1,2 м
    speckle(g, p, '#8c8f92', 0.05, 3000);
    g.fillStyle = '#6c6f72'; g.fillRect(0, 0, 3, p); g.fillRect(p / 2, 0, 3, p);
  }),
};

// =====================================================================
//  Материалы
// =====================================================================
const std = (o) => new THREE.MeshStandardMaterial({ roughness: 0.85, ...o });
const glow = (color, emissive) => new THREE.MeshStandardMaterial({ color, emissive, emissiveIntensity: 0.05, roughness: 0.5 });
const MAT = {
  plaster: std({ map: TEX.plaster }), int: std({ color: 0xf6f4ef }), slab: std({ color: 0xf2f0eb }),
  panel: std({ map: TEX.panel }), metal: std({ map: TEX.seam, roughness: 0.55, metalness: 0.1 }),
  wood: std({ map: TEX.larch, roughness: 0.7 }),
  floor: std({ map: TEX.parquet, roughness: 0.55 }), tile: std({ map: TEX.tile, roughness: 0.35 }),
  terrace: std({ map: TEX.terrace }), concrete: std({ map: TEX.concrete }), paving: std({ map: TEX.paving }),
  gravel: std({ map: TEX.gravel }), grass: std({ map: TEX.grass }), grassOut: std({ map: TEX.grass, color: 0xb9c9a0 }),
  glass: new THREE.MeshStandardMaterial({ color: 0xa8cbe0, transparent: true, opacity: 0.28, roughness: 0.05, metalness: 0.2, side: THREE.DoubleSide, depthWrite: false }),
  rail: new THREE.MeshStandardMaterial({ color: 0xcfe6f0, transparent: true, opacity: 0.22, side: THREE.DoubleSide, depthWrite: false }),
  frame: std({ color: 0x34383d, roughness: 0.4, metalness: 0.4 }),
  stair: std({ color: 0xcfa877, roughness: 0.6 }), pv: std({ color: 0x1b2846, roughness: 0.25, metalness: 0.6 }),
  // мебель
  oak: std({ map: TEX.oak, roughness: 0.55 }), white: std({ color: 0xf3f3f1, roughness: 0.45 }), door: std({ color: 0xefede8, roughness: 0.5 }),
  lacquer: std({ color: 0xeeeeec, roughness: 0.25 }), walnut: std({ map: TEX.oak, color: 0x7a5a44, roughness: 0.5 }),
  fabric: std({ map: TEX.fabric, color: 0x7f848b, roughness: 1 }), fabric2: std({ map: TEX.fabric, color: 0xd9d1c4, roughness: 1 }),
  outdoor: std({ map: TEX.fabric, color: 0xb9c62e, roughness: 1 }), leather: std({ color: 0x6e4a30, roughness: 0.45 }),
  pillowA: std({ map: TEX.fabric, color: 0xc0aa8a, roughness: 1 }), pillowB: std({ map: TEX.fabric, color: 0x5b7889, roughness: 1 }),
  bedding: std({ color: 0xf5f3ee, roughness: 0.95 }), blanket: std({ map: TEX.fabric, color: 0xa9b8c6, roughness: 1 }), throw: std({ map: TEX.fabric, color: 0x8a7a66, roughness: 1 }),
  rug: std({ map: TEX.fabric, color: 0x9a8e80, roughness: 1 }),
  black: std({ color: 0x1d1e20, roughness: 0.35 }), matBlack: std({ color: 0x232426, roughness: 0.6, metalness: 0.4 }),
  stone: std({ color: 0x2f3133, roughness: 0.25 }), marble: std({ color: 0xe9e7e2, roughness: 0.2 }),
  steel: std({ color: 0xb8bcc1, roughness: 0.25, metalness: 0.85 }), chrome: std({ color: 0xdfe3e6, roughness: 0.08, metalness: 1 }),
  ceramic: std({ color: 0xfcfcfc, roughness: 0.12 }), water: std({ color: 0x9fd0e6, roughness: 0.03, metalness: 0.1 }),
  mirror: std({ color: 0xd2dde3, roughness: 0.03, metalness: 0.95 }), ovenGlass: std({ color: 0x0f1012, roughness: 0.05, metalness: 0.5 }),
  curtain: new THREE.MeshStandardMaterial({ color: 0xf3efe6, roughness: 1, transparent: true, opacity: 0.82, side: THREE.DoubleSide }),
  pot: std({ color: 0x5f6368 }), potDark: std({ color: 0x2a2c2f, roughness: 0.6 }), soil: std({ color: 0x3b2d22 }),
  leaf: std({ color: 0x3e6b34 }), leafDark: std({ color: 0x2c4a2a }), leafLight: std({ color: 0x5f8a3f }), trunk: std({ color: 0x5a4330 }),
  tire: std({ color: 0x151515, roughness: 0.9 }), rim: std({ color: 0xc9cdd1, roughness: 0.2, metalness: 0.9 }),
  carWhite: std({ color: 0xeeeeec, roughness: 0.18, metalness: 0.35 }), carDark: std({ color: 0x27303b, roughness: 0.18, metalness: 0.45 }),
  carGlass: std({ color: 0x1a222b, roughness: 0.05, metalness: 0.6 }), headlight: glow(0xffffff, 0xffffff), taillight: glow(0x8a1010, 0xff2020),
  box: std({ color: 0xc4a77d }), plasticGrey: std({ color: 0x9aa0a6, roughness: 0.6 }),
  book1: std({ color: 0x8c3b2e }), book2: std({ color: 0x2f4d6b }), book3: std({ color: 0xc9b98f }), book4: std({ color: 0x3d5b3a }),
  // светящиеся: яркость меняется в режиме «вечер»
  lamp: glow(0xfff6e6, 0xffd9a0), globe: glow(0xfff3dd, 0xffcf8a), led: glow(0xffffff, 0xffd59a),
  fire: new THREE.MeshStandardMaterial({ color: 0xff8a3c, emissive: 0xff6a1a, emissiveIntensity: 3, side: THREE.DoubleSide }),
};
MAT.glass.roughness = 0.02; MAT.glass.metalness = 0;   // стекло отражает небо
// швейная мастерская: зелёный коврик для раскроя и ткани разных цветов
MAT.mat = std({ color: 0x2f6b55, roughness: 0.7 });
MAT.brass = std({ color: 0xb08d57, roughness: 0.3, metalness: 0.9 });
MAT.walnutDark = std({ map: TEX.oak, color: 0x5b3d2a, roughness: 0.5 });   // тёмный орех для портала
// ---------- цоколь: кинозал и кладовая ----------
MAT.walnutPanel = std({ roughness: 0.6, map: tex(512, 2.4, (g, p) => {   // ореховые стеновые панели 1,2 × 1,5 м с узким швом
  g.fillStyle = '#5a3c29'; g.fillRect(0, 0, p, p);
  for (let i = 0; i < 160; i++) { g.strokeStyle = `rgba(${rnd() > 0.5 ? '35,20,12' : '140,100,70'},${0.08 + rnd() * 0.12})`; g.lineWidth = 1 + rnd() * 2; g.beginPath(); const y = rnd() * p; g.moveTo(0, y); g.bezierCurveTo(p / 3, y + (rnd() - 0.5) * 14, p * 2 / 3, y + (rnd() - 0.5) * 14, p, y + (rnd() - 0.5) * 8); g.stroke(); }
  g.fillStyle = 'rgba(15,8,4,.8)'; g.fillRect(0, 0, 2, p); g.fillRect(p / 2, 0, 2, p); g.fillRect(0, p * 0.375, p, 2); g.fillRect(0, p * 0.875, p, 2);
}) });
MAT.carpet = std({ map: TEX.concrete, color: 0xb9ab97, roughness: 1 });   // мягкий ковролин
MAT.lighttile = std({ map: TEX.tile, color: 0xefe6d8, roughness: 0.35 });
MAT.jute = std({ map: TEX.fabric, color: 0xa8916c, roughness: 1 });
MAT.linen = std({ map: TEX.fabric, color: 0xd6ccbd, roughness: 1 });
MAT.taupe = std({ color: 0xa69a8b, roughness: 0.6 });
MAT.clearPlastic = new THREE.MeshStandardMaterial({ color: 0xeef3f5, transparent: true, opacity: 0.35, roughness: 0.15, depthWrite: false });
MAT.wicker = std({ map: TEX.fabric, color: 0xb58a55, roughness: 1 });

  for (const sx of [-1, 1]) for (const sz of [-1, 1]) out.push([Cy(r, h, sx * (w / 2 - inset), y0, sz * (d / 2 - inset)), mat]);
  return out;
};

const leafy = (r, x, y, z, mat = 'leaf') => {
  const n = Math.round(30 + r * 140), parts = [];
  for (let i = 0; i < n; i++) {
    const a = rnd() * Math.PI * 2, b = Math.acos(2 * rnd() - 1), rr = r * (0.55 + rnd() * 0.45);
    const leaf = new THREE.SphereGeometry(1, 6, 4).scale(0.035 + r * 0.05, 0.008, 0.07 + r * 0.09);
    leaf.rotateX((rnd() - 0.5) * 1.6).rotateY(rnd() * 6.28).rotateZ((rnd() - 0.5) * 1.2);
    parts.push(leaf.translate(x + rr * Math.sin(b) * Math.cos(a), y + rr * Math.cos(b) * 0.85, z + rr * Math.sin(b) * Math.sin(a)));
  }
  return [mergeGeometries(parts), mat];
};

  // ---------- новогодняя ёлка (по референсу): заснеженная, красно-кремовые шары, гирлянда, корзина, подарки ----------
  xmastree(o) {
    const H = o.h || 4, R = o.r || 0.9, r = [[Cy(0.06, H * 0.9, 0, 0.3), 'trunk'], [Cy(R * 0.42, 0.38, 0, 0, 0, R * 0.36, 28), 'wicker']];
    const radAt = y => R * Math.pow(Math.max(0, 1 - (y - 0.45) / (H - 0.45)), 0.95) + 0.04;
    for (let y = 0.45; y < H - 0.15; y += 0.11) {   // ярусы веток: зелёная ветка + снег сверху
      const rr = radAt(y), n = Math.max(5, Math.round(rr * 24));
      for (let i = 0; i < n; i++) {
        const a = (i + rnd() * 0.6) / n * Math.PI * 2, L = rr * (0.8 + rnd() * 0.35), droop = 0.2 + rnd() * 0.25;
        // ветка: центральная лапа + две боковые веточки; сверху — снег (как на заснеженной ёлке с фото)
        const mk = (sy, sz, dy, sc, yaw, len) => new THREE.SphereGeometry(1, 6, 4).scale(len / 2 * sc, sy, sz).rotateZ(-droop).translate(len / 2 * Math.cos(droop) * sc, dy, 0)
          .rotateY(yaw).translate(0, 0, 0).rotateY(-a).translate(0, y, 0);
        r.push([mk(0.05, 0.13, 0, 1, 0, L), 'needle'], [mk(0.035, 0.11, 0.04, 0.9, 0, L), 'snow']);
        for (const s of [-1, 1]) {
          const g = mk(0.04, 0.09, 0, 1, s * 0.55, L * 0.55).translate(Math.cos(a) * L * 0.35, -0.02, Math.sin(a) * L * 0.35);
          const sn = mk(0.03, 0.08, 0.035, 0.9, s * 0.55, L * 0.55).translate(Math.cos(a) * L * 0.35, -0.02, Math.sin(a) * L * 0.35);
          r.push([g, 'needle'], [sn, 'snow']);
        }
      }
    }
    const onTree = (k, y) => { const a = rnd() * Math.PI * 2, rr = radAt(y) * k; return [Math.cos(a) * rr, y, Math.sin(a) * rr]; };
    for (let i = 0; i < 120; i++) {   // шары: красные, кремовые, золотые
      const y = 0.6 + rnd() * (H - 1.0), [x, yy, z] = onTree(0.88, y), s = 0.045 + rnd() * 0.05;
      r.push([new THREE.SphereGeometry(s, 12, 8).translate(x, yy, z), ['ornRed', 'ornRed', 'ornCream', 'ornGold'][Math.floor(rnd() * 4)]]);
    }
    for (let i = 0; i < 45; i++) {   // тёмно-красные цветы-пуансеттии
      const y = 0.7 + rnd() * (H - 1.2), [x, yy, z] = onTree(0.9, y);
      r.push([new THREE.IcosahedronGeometry(0.1 + rnd() * 0.05, 0).scale(1, 0.55, 1).translate(x, yy, z), 'velvetRed']);
    }
    for (let i = 0; i < 300; i++) { const y = 0.5 + rnd() * (H - 0.7), [x, yy, z] = onTree(0.95, y); r.push([new THREE.SphereGeometry(0.014, 5, 3).translate(x, yy, z), 'xmasLight']); }
    for (let i = 0; i < 160; i++) { const y = 0.5 + rnd() * (H - 0.8), [x, yy, z] = onTree(0.8 + rnd() * 0.2, y); r.push([new THREE.IcosahedronGeometry(0.05 + rnd() * 0.05, 0).scale(1, 0.5, 1).translate(x, yy + 0.03, z), 'snow']); }   // снежные комья
    r.push([new THREE.ConeGeometry(0.05, 0.45, 8).translate(0, H + 0.1, 0), 'needle'], [new THREE.ConeGeometry(0.035, 0.35, 8).translate(0, H + 0.12, 0.01), 'snow']);
    // подарки перед ёлкой (лицевая сторона — к проходу)

const HINTS = {

// ---------- столкновения и пол под ногами ----------
const hit = (o, x, y, r) => x > o.x0 - r && x < o.x1 + r && y > o.y0 - r && y < o.y1 + r;

  if (lvl === 'bs') return !D.basement.area.some(a => inRect(a, x, y));   // под землёй — только внутри цоколя
  if (!D.slabs.some(s => inRect(s, x, y))) return true;          // нет пола (пустота над гостиной, лестничный проём)
  return ceilingAt(x, y, AT) - AT < 1.8;                         // под скатом слишком низко — не пройти
}
function floorZ(lvl, x, y) {

  if (lvl === 'bs') return LZ.bs;

}
function freeSpot(lvl, x, y) {

}
function placePlayer(lvl, x, y, yaw) {

  if (yaw !== undefined) player.yaw = yaw;
}
function goWalk(lvl, x, y, yaw) { placePlayer(lvl, x, y, yaw); setView('walk-' + lvl); }

// ---------- лестница: E — на другой этаж ----------
const ST = D.stair;
const STAIR = { bs: { x: ST.x[0] + ST.flight / 2, y: ST.y[1] + 0.6 }, gf: { x: ST.x[0] + ST.flight / 2, y: ST.y[1] + 0.6 }, attic: { x: ST.x[1] - ST.flight / 2, y: ST.y[1] + 0.5 } };
// куда ведёт лестница: E — наверх, Q — вниз (в цоколь)
const STAIR_GO = { bs: { KeyE: 'gf' }, gf: { KeyE: 'attic', KeyQ: 'bs' }, attic: { KeyE: 'gf' } };
const nearStair = () => Math.hypot(player.x - STAIR[player.lvl].x, player.y - STAIR[player.lvl].y) < 1.6;
function fade(cb) { $('fade').style.opacity = 1; setTimeout(() => { cb(); $('fade').style.opacity = 0; }, 260); }
function changeFloor(to) { fade(() => goWalk(to, STAIR[to].x, STAIR[to].y, 0)); }

// ---------- управление ----------
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;

addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const cvs = renderer.domElement;
cvs.addEventListener('click', () => { if (isWalk() && document.pointerLockElement !== cvs) cvs.requestPointerLock?.(); });
let drag = null;
cvs.addEventListener('mousedown', e => { if (isWalk() && !document.pointerLockElement) drag = [e.clientX, e.clientY]; });
addEventListener('mouseup', () => { drag = null; });
addEventListener('mousemove', e => {

  else if (drag) { dx = e.clientX - drag[0]; dy = e.clientY - drag[1]; drag = [e.clientX, e.clientY]; }
  else return;

// yaw — как по компасу: 0 = север (въезд), 90 = восток, 180 = юг (сад), 270 = запад
function updateWalk(dt) {
  const th = Math.PI - player.yaw * DEG;
  const mf = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
  const mr = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  if (mf || mr) {
    const sp = (keys.ShiftLeft || keys.ShiftRight ? 3.6 : 1.5) * dt / Math.hypot(mf, mr);
    const dx = (-Math.sin(th) * mf + Math.cos(th) * mr) * sp, dy = (-Math.cos(th) * mf - Math.sin(th) * mr) * sp;
    const n = Math.max(1, Math.ceil(Math.hypot(dx, dy) / 0.08));   // мелкими шагами, чтобы не «проскочить» стену
    for (let i = 0; i < n; i++) {
      if (!blocked(player.lvl, player.x + dx / n, player.y)) player.x += dx / n;
      if (!blocked(player.lvl, player.x, player.y + dy / n)) player.y += dy / n;
    }
  }
  player.z += (floorZ(player.lvl, player.x, player.y) - player.z) * Math.min(1, dt * 8);
  camera.position.set(player.x, player.z + EYE, player.y);
  camera.rotation.set(player.pitch * DEG, th, 0, 'YXZ');
}

// ---------- в какой я комнате ----------
function pip(poly, x, y) {
  let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c;
  }
  return c;
}
const roomAt = (lvl, x, y) => D.rooms.find(r => r.lvl === lvl && pip(r.poly, x, y));

  for (const r of D.rooms.filter(r => r.lvl === lvl)) {
    const d = document.createElement('div'); d.className = 'r'; d.textContent = `${r.n}. ${r.name}`; r.el = d;
    const cx = r.poly.reduce((a, p) => a + p[0], 0) / r.poly.length, cy = r.poly.reduce((a, p) => a + p[1], 0) / r.poly.length;
    d.onclick = () => fade(() => goWalk(lvl, cx, cy));

// ---------- мини-карта (как на бумажном плане: север внизу) ----------
const mapC = $('mapc'), mctx = mapC.getContext('2d');

const mx = x => (x - MAP.x0) * MAP.k, my = y => (y - MAP.y0) * MAP.k;
const mapStatic = {};
let mapLvl = null;
function buildMap(lvl) {
  const c = document.createElement('canvas'); c.width = mapC.width; c.height = mapC.height;
  const g = c.getContext('2d');
  const rect = (x0, x1, y0, y1, col) => { g.fillStyle = col; g.fillRect(mx(x0), my(y0), Math.max(1, (x1 - x0) * MAP.k), Math.max(1, (y1 - y0) * MAP.k)); };
  g.fillStyle = '#c9dcb8'; g.fillRect(0, 0, c.width, c.height);

  else if (lvl === 'gf') for (const f of D.floors) { if (f.base === undefined) rect(f.x[0], f.x[1], f.y[0], f.y[1], f.m === 'paving' ? '#8c8f93' : f.m === 'gravel' ? '#cbc5b9' : '#dddbd5'); }
  else {
    for (const s of D.slabs) rect(s.x[0], s.x[1], s.y[0], s.y[1], '#d6d4ce');
    for (let x = -1; x < 30; x += 0.2) for (let y = -1; y < 31; y += 0.2)   // низкие места под скатом
      if (D.slabs.some(s => inRect(s, x, y)) && ceilingAt(x, y, AT) - AT < 1.8) rect(x, x + 0.2, y, y + 0.2, '#b9b6b0');
  }
  for (const r of D.rooms.filter(r => r.lvl === lvl)) {

  }
  groups[f.lvl].add(selGroup);
  selBox = new THREE.Box3Helper(f.bb, 0xff9a1f); scene.add(selBox);
  placeSel(); updateEditButtons();
}
function deselectFurn(silent) {
  if (!sel) return;
  for (const m of selGroup.children) m.geometry.dispose();
  selGroup.parent.remove(selGroup); scene.remove(selBox);
  sel = selGroup = selBox = null;
  if (!silent) buildFurniture(null);
  $('eSel').textContent = 'Щёлкни по предмету, чтобы выбрать его'; updateEditButtons();
}
function commitSel() { saveEdits(); sel.bb.setFromObject(selGroup); updateFurnObst(); placeSel(); updateEditButtons(); }
function updateEditButtons() {
  for (const b of document.querySelectorAll('#edit [data-rot], #eReset')) b.disabled = !sel;
  if (sel) $('eReset').disabled = sel.pos.x === sel.base.x && sel.pos.y === sel.base.y && sel.pos.deg === sel.base.deg;
}
function rotateSel(d) { if (!sel) return; sel.pos.deg = norm360(sel.pos.deg + d); placeSel(); commitSel(); }
function nudgeSel(dx, dy) { if (!sel) return; sel.pos.x = +(sel.pos.x + dx).toFixed(3); sel.pos.y = +(sel.pos.y + dy).toFixed(3); placeSel(); commitSel(); }
function setEdit(on) {
  editMode = on;
  $('bEdit').classList.toggle('on', on);
  $('edit').style.display = on ? 'block' : 'none';
  if (on) { if (!view.startsWith('doll')) setView(isWalk() ? 'doll-' + player.lvl : 'doll-gf'); $('hint').textContent = 'Режим расстановки мебели. Колесо — приблизить, тянуть пустое место — вращать вид, правая кнопка — сдвинуть вид.'; }
  else { deselectFurn(); controls.enabled = !isWalk(); if (!isWalk()) $('hint').textContent = HINTS[view.startsWith('doll') ? 'doll' : 'orbit']; }
  updateEditButtons();
}
$('bEdit').onclick = () => setEdit(!editMode);
$('eDone').onclick = () => deselectFurn();
$('eReset').onclick = () => { if (sel) { sel.pos = { ...sel.base }; placeSel(); commitSel(); } };
$('eResetAll').onclick = () => {
  if (!confirm('Вернуть всю мебель на места из проекта? Твоя расстановка будет удалена.')) return;
  deselectFurn(true); for (const f of FURN) f.pos = { ...f.base }; saveEdits(); buildFurniture(null);
};
$('eSave').onclick = () => {
  const out = saveEdits(), n = Object.keys(out).length;
  const txt = `// Расстановка мебели из редактора, ${new Date().toLocaleString('ru')}. Передвинуто предметов: ${n}.\n` +
    `// x, y — новое место, deg — поворот (0 = лицом на север/въезд); bx, by, bdeg — как было в dom-data.js.\n` +
    `window.FURN_EDITS = ${JSON.stringify(out, null, 1)};\n`;
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'text/javascript' }));
  a.download = 'furniture-edits.js'; a.click();
};
for (const b of document.querySelectorAll('#edit [data-rot]')) b.onclick = () => rotateSel(+b.dataset.rot);

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
function mouseRay(e) {
  const r = cvs.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ndc, camera); return ray.ray;
}
function pickFurn(e) {
  const r = mouseRay(e), p = new THREE.Vector3(), lvl = viewLvl();
  let best = null, bd = Infinity, low = null, ld = Infinity;
  for (const f of FURN) {
    if (f.lvl !== lvl || CEIL_TYPES.includes(f.it.t) || !r.intersectBox(f.bb, p)) continue;
    const d = p.distanceTo(r.origin);
    if (LOW_PICK.includes(f.it.t)) { if (d < ld) { ld = d; low = f; } } else if (d < bd) { bd = d; best = f; }
  }
  return best || low;
}
function floorHit(e, f) { dragPlane.constant = -LZ[f.lvl]; return mouseRay(e).intersectPlane(dragPlane, new THREE.Vector3()); }
// перехват до OrbitControls: если щёлкнули по мебели, вид не вращаем
cvs.addEventListener('pointerdown', e => {
  if (!editMode || e.button !== 0) return;
  downAt = [e.clientX, e.clientY];
  const f = pickFurn(e);
  if (!f) return;
  selectFurn(f);
  const h = floorHit(e, f); if (!h) return;
  fdrag = { dx: f.pos.x - h.x, dy: f.pos.y - h.z };
  controls.enabled = false; cvs.setPointerCapture(e.pointerId); e.stopImmediatePropagation();
}, { capture: true });
cvs.addEventListener('pointermove', e => {
  if (!fdrag || !sel) return;
  const h = floorHit(e, sel); if (!h) return;
  const snap = v => e.altKey ? +v.toFixed(3) : Math.round(v * 20) / 20;
  sel.pos.x = snap(h.x + fdrag.dx); sel.pos.y = snap(h.z + fdrag.dy); placeSel();
});
cvs.addEventListener('pointerup', e => {
  if (fdrag) { fdrag = null; controls.enabled = true; commitSel(); return; }
  // щелчок (без перетаскивания) по пустому месту снимает выбор
  if (editMode && downAt && Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) < 5 && !pickFurn(e)) deselectFurn();
  downAt = null;
});
addEventListener('keydown', e => {
  if (!editMode || isWalk()) return;
  if (e.code === 'Escape') return deselectFurn();
  if (!sel) return;
  const st = e.shiftKey ? 90 : 15;
  if (e.code === 'KeyQ') rotateSel(-st);
  else if (e.code === 'KeyE') rotateSel(st);
  else if (e.code === 'ArrowLeft') nudgeSel(-0.05, 0); else if (e.code === 'ArrowRight') nudgeSel(0.05, 0);
  else if (e.code === 'ArrowUp') nudgeSel(0, -0.05); else if (e.code === 'ArrowDown') nudgeSel(0, 0.05);
  else return;
  e.preventDefault();
});

// ---------- адрес страницы может задать вид (для проверки): ?view=walk-gf&pos=22,3&yaw=180&mode=evening ----------
setMode('day');
{
  const Q = new URLSearchParams(location.search), v = Q.get('view') || 'orbit';
  if (Q.get('mode') === 'evening') setMode('evening');
  if (Q.get('labels') === '0') showNames = false;
  if (Q.get('roof') === '0') tRoof.checked = false;
  if (Q.get('ui') === '0') for (const id of ['ui', 'rooms', 'hint', 'fps']) $(id).style.visibility = 'hidden';
  if (v.startsWith('walk')) {
    const lvl = v.slice(5), s = START[lvl], p = (Q.get('pos') || '').split(',').map(Number);
    goWalk(lvl, p.length === 2 ? p[0] : s[0], p.length === 2 ? p[1] : s[1], Number(Q.get('yaw') ?? s[2]));
    player.pitch = Number(Q.get('pitch') ?? 0);
  } else setView(v);
  if (Q.get('edit')) { setEdit(true); const f = FURN.find(f => f.key === Q.get('sel')); if (f) selectFurn(f); }
  const xyz = k => Q.get(k)?.split(',').map(Number);
  if (xyz('cam')) { const [x, y, h] = xyz('cam'); camera.position.set(x, h, y); }
  if (xyz('target')) { const [x, y, h] = xyz('target'); controls.target.set(x, h, y); }
  controls.update();
}

// ---------- самопроверка (?check=1): двери и доступность комнат ----------
function selfCheck() {
  const out = [];
  const name = it => `${it.t} (${it.x}; ${it.y})`;
  // 1) перед каждой дверью с обеих сторон должно быть свободно 0,7 м
  for (const { w, L, ux, uy, ops } of walkWalls) {
    if (w.kind === 'rail' || w.kind === 'parapet') continue;
    const lvl = w.lvl;
    for (const op of ops) {
      const zs = op.pts.map(p => p[1]);
      if (op.o.k === 'gate' || Math.min(...zs) > 0.05 || Math.max(...zs) < 1.9) continue;
      const bot = op.pts.filter(p => p[1] < 1e-3).map(p => p[0]), s0 = Math.min(...bot), s1 = Math.max(...bot);
      const nx = -uy, ny = ux, hits = new Set();
      for (const side of [-1, 1]) for (const d of [w.t / 2 + 0.25, w.t / 2 + 0.7]) for (const f of [0.2, 0.5, 0.8]) {
        const s = s0 + (s1 - s0) * f, x = w.a[0] + ux * s + nx * d * side, y = w.a[1] + uy * s + ny * d * side;
        for (const o of OBST[lvl]) if (o.k === 'furn' && hit(o, x, y, 0)) hits.add(name(o.it));
      }
      if (hits.size) out.push(`ДВЕРЬ ${w.id} [${op.o.from ?? 'фигурная'}–${op.o.to ?? ''}]: мешает ${[...hits].join(', ')}`);
    }
  }
  // 2) до каждой комнаты можно дойти (поиск по сетке 10 см от входа / от лестницы)
  for (const lvl of LVLS) {
    const st = START[lvl], step = 0.1, x0 = -3, y0 = -4, nx = 360, ny = 390, seen = new Uint8Array(nx * ny), q = [];
    const id = (i, j) => j * nx + i;
    const si = Math.round((st[0] - x0) / step), sj = Math.round((st[1] - y0) / step);
    seen[id(si, sj)] = 1; q.push(si, sj);
    while (q.length) {
      const j = q.pop(), i = q.pop();
      for (const [di, dj] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const a = i + di, b = j + dj; if (a < 0 || b < 0 || a >= nx || b >= ny || seen[id(a, b)]) continue;
        seen[id(a, b)] = 1;
        if (!blocked(lvl, x0 + a * step, y0 + b * step)) q.push(a, b); else seen[id(a, b)] = 2;
      }
    }
    for (const r of D.rooms.filter(r => r.lvl === lvl)) {
      let free = 0, reach = 0;   // свободный пол комнаты и та его часть, куда можно дойти
      for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) {
        const x = x0 + i * step, y = y0 + j * step;
        if (!pip(r.poly, x, y) || blocked(lvl, x, y)) continue;
        free++; if (seen[id(i, j)] === 1) reach++;
      }
      if (!free || reach < free * 0.8) out.push(`НЕ ДОЙТИ: ${LVL_NAME[lvl]} — ${r.n}. ${r.name} (доступно ${free ? Math.round(reach / free * 100) : 0}% пола)`);
    }
  }
  const pre = document.createElement('pre'); pre.id = 'report';
  pre.textContent = 'CHECK\n' + (out.length ? out.join('\n') : 'ВСЁ ЧИСТО') + '\nEND';
  Object.assign(pre.style, { position: 'fixed', left: '300px', top: '10px', background: '#fff', padding: '8px', zIndex: 30, fontSize: '12px', maxWidth: '60vw', whiteSpace: 'pre-wrap' });
  document.body.appendChild(pre);
}
if (new URLSearchParams(location.search).get('check')) selfCheck();

// ---------- качество картинки ----------
// «Высокое»: мягкое затенение углов и стыков (GTAO), сглаживание, чёткие тени. «Обычное»: быстрее на слабых ноутбуках.
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 }));
composer.addPass(new RenderPass(scene, camera));
const gtao = new GTAOPass(scene, camera, innerWidth, innerHeight);
gtao.blendIntensity = 1.2;
gtao.updateGtaoMaterial({ radius: 0.6, distanceExponent: 2, thickness: 2, scale: 1, samples: 16 });
gtao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 6, rings: 2, samples: 16 });
{ // стёкла и прозрачные ограждения не должны отбрасывать «грязь» затенения
  const ov = gtao.overrideVisibility.bind(gtao);
  gtao.overrideVisibility = function () { ov(); scene.traverse(o => { if (o.isMesh && o.material.transparent) o.visible = false; }); };
}
composer.addPass(gtao);
composer.addPass(new OutputPass());
let quality = 'high', slowSec = 0;
function setQuality(q, auto) {
  quality = q;
  renderer.setPixelRatio(q === 'high' ? Math.min(devicePixelRatio, 1.5) : 1);
  renderer.setSize(innerWidth, innerHeight);
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth, innerHeight);
  const sm = q === 'high' ? 4096 : 2048;
  if (sun.shadow.mapSize.x !== sm) { sun.shadow.mapSize.set(sm, sm); sun.shadow.map?.dispose(); sun.shadow.map = null; }
  $('bQHigh').classList.toggle('on', q === 'high'); $('bQLow').classList.toggle('on', q !== 'high');
  if (auto) $('hint').textContent = 'Компьютер не успевал — качество переключено на «обычное». Вернуть можно кнопкой слева.';
}
$('bQHigh').onclick = () => { slowSec = -5; setQuality('high'); };
$('bQLow').onclick = () => setQuality('low');
setQuality(new URLSearchParams(location.search).get('q') === 'low' ? 'low' : 'high');
const draw = () => (quality === 'high' ? composer.render() : renderer.render(scene, camera));

$('bShot').onclick = () => {
  draw();
  const a = document.createElement('a');
  a.href = renderer.domElement.toDataURL('image/png');
  a.download = 'dom-3d-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.png';
  a.click();
};

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
window.__sceneReady = true;
const clock = new THREE.Clock(), fpsEl = $('fps');
let frames = 0, last = performance.now();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  if (isWalk()) updateWalk(dt); else controls.update();
  draw(); labelRenderer.render(scene, camera);
  updateHud();
  if ($('map').style.display !== 'none') drawMap();
  frames++; const now = performance.now();
  if (now - last > 1000) {
    fpsEl.textContent = frames + ' кадр/с';
    // если «высокое» качество тормозит (меньше 18 кадров 4 секунды подряд) — само переключится на «обычное»
    if (quality === 'high' && !new URLSearchParams(location.search).get('q')) { slowSec = frames < 18 ? slowSec + 1 : Math.min(slowSec, 0); if (slowSec >= 4) setQuality('low', true); }
    frames = 0; last = now;
  }
});
</script>
